spring.application.name=dba-console

# Optional .env file in the directory the application is started from (see .env.example).
# Environment variables take precedence over the values in it.
spring.config.import=optional:file:.env[.properties]

# Database connection. All values come from environment variables; there are no defaults for credentials.
# DB_URL must point to the pluggable database service, not the XE root container (CDB$ROOT), e.g.:
#   jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Directory where new datafiles are created. Paths differ between Windows and Linux installations
# (e.g. C:\app\oracle\oradata\XE\XEPDB1 vs /opt/oracle/oradata/XE/XEPDB1), which is why it is configurable.
app.oracle.datafile-dir=${DATAFILE_DIR}
